<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920"><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#d8d8d8;font-size:12px}.small{font-size:10px}.tiny{font-size:8px}.muted{fill:#85888d}.bold{font-weight:700}.title{font-size:22px}.section{font-size:15px}.mono{font-family:"DejaVu Sans Mono",monospace}.green{fill:#20b98f}.warn{fill:#d4a84b}
</style><rect width="1200" height="920" fill="#1f2125"/><rect x="3" y="3" width="1194" height="42" fill="#1f2125" stroke="#383b40"/><text x="16" y="31" class="title muted">☆</text><text x="40" y="31" class="title">Peer diagnostics and interface journal</text><rect x="1164" y="12" width="25" height="25" fill="#1f2125" stroke="#383b40"/><text x="1176.5" y="30" class="small" text-anchor="middle">⚙</text><rect x="12" y="60" width="1176" height="260" fill="#1f2125" stroke="#383b40"/><text x="22" y="82" class="section">Peer diagnostics</text><line x1="12" y1="91" x2="1188" y2="91" stroke="#383b40"/><text x="22" y="112" class="small bold">Host or address</text><rect x="22" y="120" width="380" height="26" fill="#1f2125" stroke="#383b40"/><text x="420" y="112" class="small bold">Ping count</text><rect x="420" y="120" width="160" height="26" fill="#1f2125" stroke="#383b40"/><text x="595" y="112" class="small bold">TCP/UDP port</text><rect x="595" y="120" width="180" height="26" fill="#1f2125" stroke="#383b40"/><text x="30" y="138" class="small bold">192.168.20.2</text><text x="428" y="138" class="small bold">3</text><text x="22" y="166" class="small">□ Run continuously</text><rect x="22" y="176" width="55" height="28" fill="#1b1d20" stroke="#383b40"/><text x="49.5" y="194" class="small" text-anchor="middle">Ping</text><rect x="82" y="176" width="90" height="28" fill="#1b1d20" stroke="#383b40"/><text x="127" y="194" class="small" text-anchor="middle">Traceroute</text><rect x="177" y="176" width="120" height="28" fill="#1b1d20" stroke="#383b40"/><text x="237" y="194" class="small" text-anchor="middle">Test TCP port</text><rect x="22" y="214" width="1150" height="95" fill="#000"/><text x="32" y="232" class="small mono">Starting command...</text><text x="32" y="249" class="small mono">$ /usr/bin/ping -c 3 -W 3 &#x27;192.168.20.2&#x27;</text><text x="32" y="269" class="small mono">64 bytes from 192.168.20.2: icmp_seq=1 ttl=64 time=75.9 ms</text><text x="32" y="286" class="small mono">3 packets transmitted, 3 received, 0% packet loss</text><text x="32" y="303" class="small mono">Command completed successfully.</text><rect x="12" y="334" width="1176" height="240" fill="#1f2125" stroke="#383b40"/><text x="22" y="356" class="section">Traceroute</text><rect x="22" y="370" width="1150" height="188" fill="#000"/><text x="32" y="389" class="small mono">traceroute to 192.168.20.2 (192.168.20.2), 20 hops max, 60 byte packets</text><text x="32" y="405" class="small mono"> 1  * * *</text><text x="32" y="421" class="small mono"> 2  * * *</text><text x="32" y="437" class="small mono"> 3  * * *</text><text x="32" y="453" class="small mono"> 4  * * *</text><text x="32" y="469" class="small mono"> 5  * * *</text><text x="32" y="485" class="small mono"> ...</text><text x="32" y="501" class="small mono">20  * * *</text><text x="32" y="533" class="small mono">Command completed successfully.</text><rect x="12" y="590" width="1176" height="315" fill="#1f2125" stroke="#383b40"/><text x="22" y="617" class="title">Journal for interface wg0</text><rect x="22" y="632" width="1150" height="72" fill="#1f2125" stroke="#383b40"/><text x="34" y="654" class="section">Journal options</text><text x="34" y="678" class="small bold">Line count</text><rect x="34" y="684" width="90" height="26" fill="#1f2125" stroke="#383b40"/><text x="43" y="702" class="small">200</text><rect x="135" y="682" width="70" height="28" fill="#1b1d20" stroke="#383b40"/><text x="170" y="700" class="small" text-anchor="middle">Refresh</text><text x="22" y="735" class="section">wg-quick services</text><rect x="22" y="745" width="1150" height="55" fill="#000"/><text x="34" y="778" class="small mono">No entries found.</text><text x="22" y="830" class="section">Kernel messages</text><rect x="22" y="840" width="1150" height="50" fill="#000"/><text x="34" y="871" class="small mono">No entries found.</text></svg>