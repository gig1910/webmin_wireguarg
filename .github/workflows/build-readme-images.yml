name: Build README image gallery

on:
  push:
    branches:
      - main
    paths:
      - '.github/image-parts/**'
      - '.github/workflows/build-readme-images.yml'

permissions:
  contents: write

jobs:
  build-gallery:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct the redacted WebP gallery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/images
          cat .github/image-parts/interface-details.part* \
            | base64 --decode \
            > docs/images/interface-details.webp
          echo '39b113d21ec82e66d446e63c798c18c7c4d9c680109e601eec92f39a6c279857  docs/images/interface-details.webp' \
            | sha256sum --check --strict
          file docs/images/interface-details.webp

      - name: Commit the generated image and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/images/interface-details.webp
          git rm -r .github/image-parts
          git rm .github/workflows/build-readme-images.yml
          git commit -m 'Add redacted README interface gallery'
          git push
