name: Regression and Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify toolchain
        run: |
          perl -v >/dev/null
          python3 --version
          node --version
      - name: Run regressions
        run: ./tests/run-tests.sh
      - name: Verify release metadata and manifest
        run: ./scripts/check-release.sh
      - name: Build tested release
        run: ./scripts/build-release.sh
      - name: Smoke-test packaged Webmin module
        run: sh ./scripts/smoke-release.sh
      # This is an isolated component gallery, not a live Authentic Theme capture.
      - name: Render shared UI component preview
        if: success() && github.event_name != 'pull_request'
        run: |
          PERL5LIB=tests/stub perl scripts/render-ui-preview.pl > dist/UI-COMPONENTS.html
          if command -v google-chrome >/dev/null 2>&1; then
            timeout 45s google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
              --disable-gpu --hide-scrollbars --window-size=1440,1800 \
              --screenshot="$PWD/dist/UI-COMPONENTS.png" \
              "file://$PWD/dist/UI-COMPONENTS.html"
            test -s dist/UI-COMPONENTS.png
          else
            echo "Chrome unavailable: HTML preview generated without screenshot"
          fi
      # Publishing only after the smoke gate prevents deploying untested WBM archives.
      # This is a CI artifact, not a production installation or GitHub release.
      - name: Upload verified WBM and checksums
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: webmin-wireguard-verified-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
